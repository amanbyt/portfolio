<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
  </defs>

  <!-- Hologram ring, echoing the hero 3D scene -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#0369a1" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#b45309" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Bold angular "A" -->
  <path d="M 20 102 L 60 18 L 100 102" fill="none" stroke="url(#logoGrad)"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 38 70 L 82 70" fill="none" stroke="url(#logoGrad)"
        stroke-width="11" stroke-linecap="round"/>

  <!-- Circuit-style nodes at the vertices -->
  <circle cx="60" cy="18" r="4.5" fill="url(#nodeGlow)" stroke="#0c1a2b" stroke-width="1"/>
  <circle cx="20" cy="102" r="4.5" fill="url(#nodeGlow)" stroke="#0c1a2b" stroke-width="1"/>
  <circle cx="100" cy="102" r="4.5" fill="url(#nodeGlow)" stroke="#0c1a2b" stroke-width="1"/>
</svg>
